title = "kiwoom_stock secret detection"

[extend]
useDefault = true

[[rules]]
id = "kiwoom-credential-assignment"
description = "Potential Kiwoom App Key or Secret Key assigned in source"
regex = '''(?i)(?:kiwoom[_-]?)?(?:app[_-]?key|secret[_-]?key|appkey|secretkey)[ \t"'']{0,20}(?:=|:)[ \t"'']{0,5}([A-Za-z0-9+/_=-]{24,})'''
secretGroup = 1
entropy = 3.5
keywords = [
    "kiwoom",
    "appkey",
    "app_key",
    "app-key",
    "secretkey",
    "secret_key",
    "secret-key",
]

name: Production digest promotion

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full 40-character lowercase source commit SHA
        required: true
        type: string
      image_digest:
        description: Approved exact public GHCR digest reference
        required: true
        type: string
      build_run_id:
        description: Approved candidate workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: kiwoom-stock-production-check-i-0e42e09d6c087ba29
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-0e42e09d6c087ba29
  EVIDENCE_FILENAME: production-check-evidence.json

jobs:
  promote:
    name: protected exact digest production check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      PROMOTION_ATTEMPT_ID: ${{ github.run_id }}
      APPROVED_SOURCE_SHA: ${{ vars.KIWOOM_APPROVED_SOURCE_SHA }}
      APPROVED_IMAGE_DIGEST: ${{ vars.KIWOOM_APPROVED_IMAGE_DIGEST }}
      APPROVED_BUILD_RUN_ID: ${{ vars.KIWOOM_APPROVED_BUILD_RUN_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.KIWOOM_AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout trusted promotion executor
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize bounded redacted promotion evidence
        timeout-minutes: 1
        env:
          PYTHONPATH: src
        run: >-
          python -m kiwoom_stock.deployment.promotion initialize-evidence
          --source-sha "${SOURCE_SHA}"
          --image-digest "${IMAGE_DIGEST}"
          --build-run-id "${BUILD_RUN_ID}"
          --promotion-attempt-id "${PROMOTION_ATTEMPT_ID}"
          --evidence "${EVIDENCE_FILENAME}"

      - name: Validate immutable protected boundary preflight
        timeout-minutes: 1
        env:
          PYTHONPATH: src
        run: >-
          python -m kiwoom_stock.deployment.promotion preflight
          --source-sha "${SOURCE_SHA}"
          --image-digest "${IMAGE_DIGEST}"
          --build-run-id "${BUILD_RUN_ID}"
          --promotion-attempt-id "${PROMOTION_ATTEMPT_ID}"
          --approved-source-sha "${APPROVED_SOURCE_SHA}"
          --approved-image-digest "${APPROVED_IMAGE_DIGEST}"
          --approved-build-run-id "${APPROVED_BUILD_RUN_ID}"
          --role-arn "${AWS_DEPLOY_ROLE_ARN}"
          --region "${AWS_REGION}"
          --instance-id "${EC2_INSTANCE_ID}"

      - name: Configure exact AWS deploy role with OIDC
        timeout-minutes: 1
        id: oidc
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: kiwoom-production-check
          output-credentials: true
          output-env-credentials: false
          unset-current-credentials: true

      - name: Execute authoritative production-check boundary
        timeout-minutes: 18
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ steps.oidc.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.oidc.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.oidc.outputs.aws-session-token }}
        run: >-
          python -m kiwoom_stock.deployment.promotion execute
          --source-sha "${SOURCE_SHA}"
          --image-digest "${IMAGE_DIGEST}"
          --build-run-id "${BUILD_RUN_ID}"
          --promotion-attempt-id "${PROMOTION_ATTEMPT_ID}"
          --approved-source-sha "${APPROVED_SOURCE_SHA}"
          --approved-image-digest "${APPROVED_IMAGE_DIGEST}"
          --approved-build-run-id "${APPROVED_BUILD_RUN_ID}"
          --role-arn "${AWS_DEPLOY_ROLE_ARN}"
          --region "${AWS_REGION}"
          --instance-id "${EC2_INSTANCE_ID}"
          --evidence "${EVIDENCE_FILENAME}"
          --github-api-url "${GITHUB_API_URL}"

      # Credentials are step outputs only. Keep an explicit defense-in-depth
      # clear before any following action receives an environment.
      - name: Clear OIDC credentials before artifact handling
        timeout-minutes: 1
        if: always()
        shell: bash
        run: |
          {
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_SESSION_TOKEN='
            echo 'AWS_REGION='
            echo 'AWS_DEFAULT_REGION='
          } >>"${GITHUB_ENV}"

      - name: Upload protected promotion evidence
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-check-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILENAME }}
          if-no-files-found: error
          retention-days: 14

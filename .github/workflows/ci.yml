name: Kiwoom Stock System CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_BINARY_SHA256: "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
        run: |
          if test "$(uname -m)" != "x86_64"; then
            echo "unsupported runner architecture for pinned Gitleaks asset" >&2
            exit 1
          fi
          tool_dir="${RUNNER_TEMP}/gitleaks-8.30.1"
          archive="${tool_dir}/gitleaks.tar.gz"
          install -d -m 0700 "${tool_dir}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          archive_digest="$(sha256sum "${archive}" | cut -d' ' -f1)"
          if test "${archive_digest}" != "${GITLEAKS_ARCHIVE_SHA256}"; then
            echo "Gitleaks archive checksum mismatch" >&2
            exit 1
          fi
          if ! tar -xzf "${archive}" -C "${tool_dir}" gitleaks >/dev/null 2>&1; then
            echo "Gitleaks archive extraction failed" >&2
            exit 1
          fi
          binary_digest="$(sha256sum "${tool_dir}/gitleaks" | cut -d' ' -f1)"
          if test "${binary_digest}" != "${GITLEAKS_BINARY_SHA256}"; then
            echo "Gitleaks executable checksum mismatch" >&2
            exit 1
          fi
          reported_version="$("${tool_dir}/gitleaks" version 2>/dev/null)"
          if test "${reported_version}" != "8.30.1"; then
            echo "Gitleaks executable version mismatch" >&2
            exit 1
          fi
          echo "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Gitleaks complete history
        run: |
          if ! gitleaks git --redact --no-banner --config .gitleaks.toml \
            --log-opts="--all HEAD" . >/dev/null 2>&1
          then
            echo "Gitleaks repository history scan failed" >&2
            exit 1
          fi

      - name: Verify Kiwoom heuristic with generated data
        shell: bash
        run: |
          fixture_root="$(mktemp -d "${RUNNER_TEMP}/kiwoom-gitleaks.XXXXXX")"
          trap 'rm -rf "${fixture_root}"' EXIT
          python3 - "${fixture_root}" <<'PY'
          from pathlib import Path
          import base64
          import os
          import sys

          root = Path(sys.argv[1])
          (root / "positive-underscore").mkdir()
          (root / "positive-app-hyphen").mkdir()
          (root / "positive-secret-hyphen").mkdir()
          (root / "positive-app-compact").mkdir()
          (root / "positive-secret-compact").mkdir()
          (root / "negative").mkdir()
          generated = base64.urlsafe_b64encode(os.urandom(48)).decode("ascii")
          (root / "positive-underscore" / "candidate.txt").write_text(
              f"kiwoom_secret_key = {generated}\n",
              encoding="utf-8",
          )
          (root / "positive-app-hyphen" / "candidate.txt").write_text(
              f"app-key: {generated}\n",
              encoding="utf-8",
          )
          (root / "positive-secret-hyphen" / "candidate.txt").write_text(
              f"secret-key = {generated}\n",
              encoding="utf-8",
          )
          (root / "positive-app-compact" / "candidate.json").write_text(
              f'{{"appkey": "{generated}"}}\n',
              encoding="utf-8",
          )
          (root / "positive-secret-compact" / "candidate.json").write_text(
              f'{{"secretkey": "{generated}"}}\n',
              encoding="utf-8",
          )
          (root / "negative" / "placeholders.txt").write_text(
              "KIWOOM_SECRET_KEY_FILE=/secure/path/to/file\n"
              "KIWOOM_APP_KEY=${VARIABLE}\n"
              "KIWOOM_SECRET_KEY=REPLACE_WITH_SECRET_FILE\n",
              encoding="utf-8",
          )
          PY
          for variant in \
            positive-underscore \
            positive-app-hyphen \
            positive-secret-hyphen \
            positive-app-compact \
            positive-secret-compact
          do
            set +e
            gitleaks dir --redact --no-banner --config .gitleaks.toml \
              --exit-code 97 "${fixture_root}/${variant}" >/dev/null 2>&1
            positive_status=$?
            set -e
            test "${positive_status}" -eq 97
          done
          gitleaks dir --redact --no-banner --config .gitleaks.toml \
            "${fixture_root}/negative" >/dev/null 2>&1

  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock_suffix: "311"
          - python-version: "3.14"
            lock_suffix: "314"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/locks/dev-py${{ matrix.lock_suffix }}.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes \
            -r "requirements/locks/dev-py${{ matrix.lock_suffix }}.txt"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify authoritative shadow SSM contracts
        run: |
          python deploy/check_shadow_ssm_contract.py

      - name: Critical lint
        run: |
          python -m flake8 src tests deploy/check_shadow_ssm_contract.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check
        run: |
          python -m mypy src/kiwoom_stock deploy/check_shadow_ssm_contract.py

      - name: Test
        run: |
          mkdir -p reports
          python -m pytest tests --junitxml=reports/pytest-${{ matrix.python-version }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: reports/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: package and wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/locks/dev-py314.txt
            requirements/locks/runtime-py314.txt

      - name: Install build dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements/locks/dev-py314.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Build package
        run: |
          python -m build --no-isolation

      - name: Installed wheel smoke
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --require-hashes \
            -r requirements/locks/runtime-py314.txt
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          wheel_smoke_python="${GITHUB_WORKSPACE}/.wheel-smoke/bin/python"
          cd "${RUNNER_TEMP}"
          "${wheel_smoke_python}" - <<'PY'
          import importlib
          from importlib import resources
          from pathlib import Path
          import pkgutil
          import sys

          import kiwoom_stock
          from kiwoom_stock.domain import state
          from kiwoom_stock.core.state_manager import PhysicalStateTracker

          assert kiwoom_stock.__name__ == "kiwoom_stock"
          assert state.calculate_initial_velocity_from_rsi(65.0) == 1.5
          assert PhysicalStateTracker.__name__ == "PhysicalStateTracker"
          importlib.import_module("kiwoom_stock.application.lifecycle")
          importlib.import_module("kiwoom_stock.monitoring.reporter")

          module_names = sorted(
              module.name
              for module in pkgutil.walk_packages(
                  kiwoom_stock.__path__, kiwoom_stock.__name__ + "."
              )
          )
          for module_name in module_names:
              if module_name != "kiwoom_stock.__main__":
                  importlib.import_module(module_name)

          sys.argv = ["kiwoom_stock"]
          try:
              importlib.import_module("kiwoom_stock.__main__")
          except SystemExit as exc:
              assert exc.code == 0
          else:
              raise AssertionError("kiwoom_stock.__main__ must terminate through its CLI")

          prompts = resources.files("kiwoom_stock.resources.prompts")
          assert "The 6 Physical Forces" in prompts.joinpath(
              "daily_postmortem_system.md"
          ).read_text(encoding="utf-8")
          assert "{stats}" in prompts.joinpath(
              "daily_postmortem_user.md"
          ).read_text(encoding="utf-8")
          assert not Path("trades.db").exists()
          assert not Path("logs").exists()
          PY
          KIWOOM_API_MODE=disabled KIWOOM_PROCESS_NAME=paper-monitor \
            "${wheel_smoke_python}" -m kiwoom_stock --check-config
          set +e
          "${wheel_smoke_python}" -m kiwoom_stock --check-config >/tmp/check-config.out 2>/tmp/check-config.err
          status=$?
          set -e
          test "$status" -eq 1
          grep -q KIWOOM_PROCESS_NAME /tmp/check-config.err

      - name: Upload package artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14

name: Shadow worker activation

on:
  workflow_dispatch:
    inputs:
      desired_state:
        description: Exact bounded shadow action
        required: true
        type: choice
        options: [oneshot, continuous, stop]
      source_sha:
        description: Full 40-character lowercase source SHA
        required: true
        type: string
      image_digest:
        description: Exact public GHCR image digest
        required: true
        type: string
      build_run_id:
        description: Successful production-check candidate run ID
        required: false
        type: string
      compose_shadow_sha256:
        description: SHA256 of compose.shadow.yaml at source SHA
        required: false
        type: string
      activation_id:
        description: Unique non-secret activation identifier
        required: true
        type: string
      worker_sha256:
        description: Exact installed shadow worker SHA256 from rollout evidence
        required: true
        type: string
      validator_sha256:
        description: Exact installed runtime evidence validator SHA256
        required: true
        type: string
      shadow_document_sha256:
        description: Exact canonical activation document SHA256 from rollout evidence
        required: true
        type: string
      status_notification:
        description: Protected control-plane status notification
        required: true
        default: slack
        type: choice
        options: [slack, disabled]

permissions: {}

concurrency:
  group: kiwoom-stock-shadow-i-0e42e09d6c087ba29
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-0e42e09d6c087ba29
  SHADOW_DOCUMENT_NAME: KiwoomStock-ShadowWorker
  EVIDENCE_FILENAME: shadow-worker-evidence.json
  DIAGNOSTIC_FILENAME: shadow-worker-diagnostic.json
  NOTIFICATION_RECEIPT_FILENAME: shadow-status-notification.json

jobs:
  activate:
    name: protected bounded shadow action
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: production-shadow
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout exact trusted activation executor
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || vars.KIWOOM_SHADOW_SCHEDULE_SOURCE_SHA || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact current control-plane helpers
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .shadow-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve effective shadow activation tuple
        id: resolve
        timeout-minutes: 1
        env:
          INPUT_DESIRED_STATE: ${{ inputs.desired_state }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_COMPOSE_SHADOW_SHA256: ${{ inputs.compose_shadow_sha256 }}
          INPUT_ACTIVATION_ID: ${{ inputs.activation_id }}
          INPUT_WORKER_SHA256: ${{ inputs.worker_sha256 }}
          INPUT_VALIDATOR_SHA256: ${{ inputs.validator_sha256 }}
          INPUT_SHADOW_DOCUMENT_SHA256: ${{ inputs.shadow_document_sha256 }}
          INPUT_STATUS_NOTIFICATION: ${{ inputs.status_notification }}
          SCHEDULE_SOURCE_SHA: ${{ vars.KIWOOM_SHADOW_SCHEDULE_SOURCE_SHA }}
          SCHEDULE_IMAGE_DIGEST: ${{ vars.KIWOOM_SHADOW_SCHEDULE_IMAGE_DIGEST }}
          SCHEDULE_BUILD_RUN_ID: ${{ vars.KIWOOM_SHADOW_SCHEDULE_BUILD_RUN_ID }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == schedule ]]; then
            case "${EVENT_SCHEDULE}" in
              '50 23 * * 0-4') desired_state=continuous ;;
              '35 6 * * 1-5') desired_state=stop ;;
              *) echo 'unexpected shadow schedule' >&2; exit 64 ;;
            esac
            source_sha="${SCHEDULE_SOURCE_SHA}"
            image_digest="${SCHEDULE_IMAGE_DIGEST}"
            build_run_id="${SCHEDULE_BUILD_RUN_ID}"
            activation_id="shadow-session-$(TZ=Asia/Seoul date +%Y%m%d)"
            status_notification=slack
            worker_sha256="$(sha256sum deploy/ec2/shadow_worker_control.sh | cut -d' ' -f1)"
            validator_sha256="$(sha256sum deploy/ec2/shadow_runtime_evidence.py | cut -d' ' -f1)"
            shadow_document_sha256="$(PYTHONPATH=src python3 - <<'PY'
          from pathlib import Path
          from kiwoom_stock.deployment.shadow_rollout import canonical_json, sha256

          _, canonical = canonical_json(
              Path("deploy/ssm/shadow-worker-document.yaml").read_bytes()
          )
          print(sha256(canonical))
          PY
            )"
            if [[ "${desired_state}" == stop ]]; then
              build_run_id=""
              compose_shadow_sha256=""
            else
              compose_shadow_sha256="$(sha256sum compose.shadow.yaml | cut -d' ' -f1)"
            fi
          else
            desired_state="${INPUT_DESIRED_STATE}"
            source_sha="${INPUT_SOURCE_SHA}"
            image_digest="${INPUT_IMAGE_DIGEST}"
            build_run_id="${INPUT_BUILD_RUN_ID}"
            compose_shadow_sha256="${INPUT_COMPOSE_SHADOW_SHA256}"
            activation_id="${INPUT_ACTIVATION_ID}"
            worker_sha256="${INPUT_WORKER_SHA256}"
            validator_sha256="${INPUT_VALIDATOR_SHA256}"
            shadow_document_sha256="${INPUT_SHADOW_DOCUMENT_SHA256}"
            status_notification="${INPUT_STATUS_NOTIFICATION}"
          fi
          {
            printf 'desired_state=%s\n' "${desired_state}"
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'image_digest=%s\n' "${image_digest}"
            printf 'build_run_id=%s\n' "${build_run_id}"
            printf 'compose_shadow_sha256=%s\n' "${compose_shadow_sha256}"
            printf 'activation_id=%s\n' "${activation_id}"
            printf 'worker_sha256=%s\n' "${worker_sha256}"
            printf 'validator_sha256=%s\n' "${validator_sha256}"
            printf 'shadow_document_sha256=%s\n' "${shadow_document_sha256}"
            printf 'status_notification=%s\n' "${status_notification}"
          } >>"${GITHUB_OUTPUT}"

      - name: Observe scheduled shadow run start
        id: schedule_observation
        if: github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DESIRED_STATE: ${{ steps.resolve.outputs.desired_state }}
        shell: bash
        run: |
          set -euo pipefail
          observation_invalid() {
            {
              echo '### Shadow schedule observation'
              echo
              echo '- observation: `invalid`'
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          }
          current_run_file="${RUNNER_TEMP}/shadow-current-run-${GITHUB_RUN_ID}.json"
          observation_file="${RUNNER_TEMP}/shadow-schedule-observation-${GITHUB_RUN_ID}.json"
          rm -f -- "${current_run_file}" "${observation_file}"
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '{event: .event, id: .id, created_at: .created_at, run_started_at: .run_started_at, head_branch: .head_branch}' \
            >"${current_run_file}" || observation_invalid
          python3 .shadow-control-plane/deploy/shadow_schedule_observation.py \
            --run-json "${current_run_file}" \
            --run-id "${GITHUB_RUN_ID}" \
            --cron "${EVENT_SCHEDULE}" \
            --desired-state "${DESIRED_STATE}" \
            --output "${observation_file}" \
            --summary "${GITHUB_STEP_SUMMARY}" || observation_invalid

      - name: Validate immutable shadow tuple and candidate run
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
          BUILD_RUN_ID: ${{ steps.resolve.outputs.build_run_id }}
          COMPOSE_SHADOW_SHA256: ${{ steps.resolve.outputs.compose_shadow_sha256 }}
          ACTIVATION_ID: ${{ steps.resolve.outputs.activation_id }}
          DESIRED_STATE: ${{ steps.resolve.outputs.desired_state }}
          WORKER_SHA256: ${{ steps.resolve.outputs.worker_sha256 }}
          VALIDATOR_SHA256: ${{ steps.resolve.outputs.validator_sha256 }}
          SHADOW_DOCUMENT_SHA256: ${{ steps.resolve.outputs.shadow_document_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          validation_failed() {
            printf 'shadow_activation_preflight_failed category=%s\n' "$1" >&2
            exit 1
          }
          [[ "${GITHUB_REF}" == refs/heads/main ]] \
            || validation_failed ref_not_main
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || validation_failed source_sha_invalid
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || validation_failed github_sha_invalid
          compare_result="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${GITHUB_SHA}" \
            --jq '[.status,.merge_base_commit.sha,.base_commit.sha] | @tsv' \
            || validation_failed github_compare_unavailable)"
          IFS=$'\t' read -r compare_status merge_base_sha base_sha <<<"${compare_result}"
          [[ "${compare_status}" == ahead || "${compare_status}" == identical ]] \
            || validation_failed github_compare_status_invalid
          [[ "${merge_base_sha}" == "${SOURCE_SHA}" ]] \
            || validation_failed github_compare_base_invalid
          [[ "${base_sha}" == "${SOURCE_SHA}" ]] \
            || validation_failed github_compare_target_invalid
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]] \
            || validation_failed source_checkout_mismatch
          [[ "$(git -C .shadow-control-plane rev-parse HEAD)" == "${GITHUB_SHA}" ]] \
            || validation_failed control_plane_checkout_mismatch
          [[ "$(git -C .shadow-control-plane status --short)" == "" ]] \
            || validation_failed control_plane_checkout_dirty
          [[ "${IMAGE_DIGEST}" =~ ^ghcr\.io/spicechicken/kiwoom_stock@sha256:[0-9a-f]{64}$ ]] \
            || validation_failed image_digest_invalid
          [[ "${ACTIVATION_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] \
            || validation_failed activation_id_invalid
          [[ "${WORKER_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
            || validation_failed worker_sha_invalid
          [[ "${VALIDATOR_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
            || validation_failed validator_sha_invalid
          [[ "${SHADOW_DOCUMENT_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
            || validation_failed shadow_document_sha_invalid
          [[ "${DESIRED_STATE}" == oneshot || "${DESIRED_STATE}" == continuous || "${DESIRED_STATE}" == stop ]] \
            || validation_failed desired_state_invalid
          actual_validator_sha256="$(sha256sum deploy/ec2/shadow_runtime_evidence.py | cut -d' ' -f1)"
          [[ "${actual_validator_sha256}" == "${VALIDATOR_SHA256}" ]] \
            || validation_failed validator_sha_mismatch
          python3 -m py_compile deploy/ec2/shadow_runtime_evidence.py
          python3 -m py_compile \
            .shadow-control-plane/deploy/ec2/shadow_invocation_diagnostic.py \
            .shadow-control-plane/deploy/shadow_schedule_observation.py \
            .shadow-control-plane/deploy/notify_shadow_status.py
          if [[ "${DESIRED_STATE}" == stop ]]; then
            [[ -z "${BUILD_RUN_ID}${COMPOSE_SHADOW_SHA256}" ]] \
              || validation_failed stop_inputs_present
            exit 0
          fi
          [[ "${SOURCE_SHA}" == "${GITHUB_SHA}" ]] \
            || validation_failed source_not_current_main
          [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]] \
            || validation_failed build_run_id_invalid
          actual_compose_shadow_sha256="$(sha256sum compose.shadow.yaml | cut -d' ' -f1)"
          [[ "${actual_compose_shadow_sha256}" =~ ^[0-9a-f]{64}$ ]] \
            || validation_failed compose_shadow_sha_invalid
          if [[ -n "${COMPOSE_SHADOW_SHA256}" ]]; then
            [[ "${COMPOSE_SHADOW_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
              || validation_failed compose_shadow_input_invalid
            [[ "${actual_compose_shadow_sha256}" == "${COMPOSE_SHADOW_SHA256}" ]] \
              || validation_failed compose_shadow_hash_mismatch
          fi
          run_json="${RUNNER_TEMP}/candidate-run.json"
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" \
            >"${run_json}" \
            || validation_failed candidate_run_unavailable
          python3 - "${run_json}" "${SOURCE_SHA}" <<'PY'
          import json
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {
              "status": "completed", "conclusion": "success",
              "head_sha": sys.argv[2], "head_branch": "main",
              "event": "workflow_dispatch",
              "path": ".github/workflows/cd-production-check.yml",
          }
          if any(run.get(key) != value for key, value in required.items()):
              raise SystemExit("candidate run provenance mismatch")
          PY
          docker pull "${IMAGE_DIGEST}" \
            || validation_failed image_pull_failed
          [[ "$(docker image inspect "${IMAGE_DIGEST}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "${SOURCE_SHA}" ]] \
            || validation_failed image_revision_mismatch
          [[ "$(docker image inspect "${IMAGE_DIGEST}" --format '{{.Config.User}}')" == "10001:10001" ]] \
            || validation_failed image_user_mismatch
          [[ "$(docker image inspect "${IMAGE_DIGEST}" --format '{{json .Config.Entrypoint}}')" == '["python","/usr/local/bin/kiwoom-runtime-entrypoint.py"]' ]] \
            || validation_failed image_entrypoint_mismatch

      - name: Preflight protected Slack status boundary
        if: steps.resolve.outputs.status_notification == 'slack'
        timeout-minutes: 1
        env:
          KIWOOM_SHADOW_SLACK_WEBHOOK_URL: ${{ secrets.KIWOOM_SHADOW_SLACK_WEBHOOK_URL }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          python3 .shadow-control-plane/deploy/notify_shadow_status.py \
            --check-webhook

      - name: Configure exact shadow activation role with OIDC
        timeout-minutes: 1
        id: oidc
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.KIWOOM_AWS_SHADOW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: kiwoom-shadow-activation
          output-credentials: true
          output-env-credentials: false
          unset-current-credentials: true

      - name: Execute bounded shadow action
        timeout-minutes: 18
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.oidc.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.oidc.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.oidc.outputs.aws-session-token }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
          BUILD_RUN_ID: ${{ steps.resolve.outputs.build_run_id }}
          COMPOSE_SHADOW_SHA256: ${{ steps.resolve.outputs.compose_shadow_sha256 }}
          ACTIVATION_ID: ${{ steps.resolve.outputs.activation_id }}
          DESIRED_STATE: ${{ steps.resolve.outputs.desired_state }}
          WORKER_SHA256: ${{ steps.resolve.outputs.worker_sha256 }}
          VALIDATOR_SHA256: ${{ steps.resolve.outputs.validator_sha256 }}
          SHADOW_DOCUMENT_SHA256: ${{ steps.resolve.outputs.shadow_document_sha256 }}
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          # codex-cd-ssm-document: deploy/ssm/shadow-worker-document.yaml
          [[ "$(sha256sum deploy/ec2/shadow_runtime_evidence.py | cut -d' ' -f1)" == "${VALIDATOR_SHA256}" ]]
          document_version="$(python3 -c 'import os; from kiwoom_stock.deployment.shadow_rollout import attest_activation_document; print(attest_activation_document(os.environ["SHADOW_DOCUMENT_SHA256"]))')"
          [[ "${document_version}" =~ ^[1-9][0-9]*$ ]]
          if [[ "${DESIRED_STATE}" == stop ]]; then
            ssm_compose_hash="$(printf '0%.0s' {1..64})"
            validator_mode=shadow-continuous
            validator_event=terminal
          else
            ssm_compose_hash="$(sha256sum compose.shadow.yaml | cut -d' ' -f1)"
            if [[ -n "${COMPOSE_SHADOW_SHA256}" ]]; then
              [[ "${ssm_compose_hash}" == "${COMPOSE_SHADOW_SHA256}" ]]
            fi
            if [[ "${DESIRED_STATE}" == oneshot ]]; then
              validator_mode=shadow-once
              validator_event=oneshot
            else
              validator_mode=shadow-continuous
              validator_event=cycle
            fi
          fi
          command_id="$(aws ssm send-command \
            --document-name "${SHADOW_DOCUMENT_NAME}" \
            --document-version "${document_version}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --parameters \
              "DesiredState=${DESIRED_STATE},ImageDigest=${IMAGE_DIGEST},SourceSha=${SOURCE_SHA},ActivationId=${ACTIVATION_ID},ComposeShadowSha256=${ssm_compose_hash},ExpectedWorkerSha256=${WORKER_SHA256},ExpectedValidatorSha256=${VALIDATOR_SHA256},ExpectedShadowDocumentSha256=${SHADOW_DOCUMENT_SHA256},ExpectedInstanceId=${EC2_INSTANCE_ID},Region=${AWS_REGION}" \
            --comment "kiwoom shadow activation ${ACTIVATION_ID}" \
            --timeout-seconds 1020 --max-concurrency 1 --max-errors 0 \
            --query 'Command.CommandId' --output text)"
          [[ "${command_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          status=Pending
          for _ in $(seq 1 102); do
            status="$(aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}" --query Status --output text 2>/dev/null || true)"
            case "${status}" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          invocation_file="${RUNNER_TEMP}/shadow-invocation.json"
          aws ssm get-command-invocation --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" --output json >"${invocation_file}"
          if [[ "${DESIRED_STATE}" == stop ]]; then
            python3 - "${invocation_file}" shadow-telemetry.manifest.json <<'PY'
          import json, sys
          from pathlib import Path
          invocation=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          records=[]
          for raw in invocation.get("StandardOutputContent", "").splitlines():
              try: value=json.loads(raw.split("|",1)[-1].strip())
              except json.JSONDecodeError: continue
              if value.get("event") == "telemetry_manifest": records.append(value)
          if len(records) > 1: raise SystemExit("duplicate telemetry manifest")
          if records: Path(sys.argv[2]).write_text(json.dumps(records[0],sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
            if [[ -s shadow-telemetry.manifest.json ]] && ! python3 -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1])).get("legacy_terminal_only") else 1)' shadow-telemetry.manifest.json; then
              : >shadow-telemetry.jsonl.gz
              telemetry_session_date="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["session_date_kst"])' shadow-telemetry.manifest.json)"
              [[ "${telemetry_session_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
              [[ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["activation_id"])' shadow-telemetry.manifest.json)" == "${ACTIVATION_ID}" ]]
              telemetry_size="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["compressed_bytes"])' shadow-telemetry.manifest.json)"
              (( telemetry_size >= 0 && telemetry_size <= 4 * 1024 * 1024 ))
              for ((telemetry_offset=0; telemetry_offset<telemetry_size; telemetry_offset+=12288)); do
                page_length=$(( telemetry_size - telemetry_offset )); (( page_length > 12288 )) && page_length=12288
                page_command_id="$(aws ssm send-command --document-name "$SHADOW_DOCUMENT_NAME" --document-version "${document_version}" --instance-ids "$EC2_INSTANCE_ID" --parameters "DesiredState=telemetry-export-page,ImageDigest=${IMAGE_DIGEST},SourceSha=${SOURCE_SHA},ActivationId=${ACTIVATION_ID},ComposeShadowSha256=$(printf '0%.0s' {1..64}),TelemetrySessionDateKst=${telemetry_session_date},TelemetryOffset=${telemetry_offset},TelemetryLength=${page_length},ExpectedWorkerSha256=${WORKER_SHA256},ExpectedValidatorSha256=${VALIDATOR_SHA256},ExpectedShadowDocumentSha256=${SHADOW_DOCUMENT_SHA256},ExpectedInstanceId=${EC2_INSTANCE_ID},Region=${AWS_REGION}" --comment "kiwoom shadow telemetry page ${ACTIVATION_ID}:${telemetry_offset}" --timeout-seconds 1020 --max-concurrency 1 --max-errors 0 --query 'Command.CommandId' --output text)"
                page_invocation="${RUNNER_TEMP}/shadow-telemetry-page-${telemetry_offset}.json"
                for _ in $(seq 1 102); do
                  status="$(aws ssm get-command-invocation --command-id "${page_command_id}" --instance-id "${EC2_INSTANCE_ID}" --query Status --output text 2>/dev/null || true)"
                  if [ "${status}" = Success ] || [ "${status}" = Failed ] || [ "${status}" = Cancelled ] || [ "${status}" = TimedOut ]; then break; fi
                  sleep 10
                done
                aws ssm get-command-invocation --command-id "${page_command_id}" --instance-id "${EC2_INSTANCE_ID}" --output json >"${page_invocation}"
                python3 - "${page_invocation}" shadow-telemetry.jsonl.gz "${telemetry_offset}" "${page_length}" "${ACTIVATION_ID}" "${telemetry_session_date}" "${SOURCE_SHA}" "${IMAGE_DIGEST}" "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["compressed_sha256"])' shadow-telemetry.manifest.json)" "${telemetry_size}" <<'PY'
          import base64,json,sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("Status") != "Success" or value.get("ResponseCode") != 0: raise SystemExit("telemetry page invocation failed")
          rows=[json.loads(raw) for raw in value.get("StandardOutputContent","").splitlines() if raw.strip()]
          if len(rows)!=1: raise SystemExit("invalid telemetry page response")
          page=rows[0]; expected_offset=int(sys.argv[3]); expected_length=int(sys.argv[4]); expected_size=int(sys.argv[10])
          if (page.get("activation_id"), page.get("session_date_kst"), page.get("source_sha"), page.get("image_digest"), page.get("offset"), page.get("length"), page.get("compressed_bytes")) != (sys.argv[5],sys.argv[6],sys.argv[7],sys.argv[8],expected_offset,expected_length,expected_size): raise SystemExit("telemetry page identity mismatch")
          if page.get("compressed_sha256") != sys.argv[9]: raise SystemExit("telemetry page manifest mismatch")
          decoded=base64.b64decode(page.get("page_base64",""),validate=True)
          if len(decoded) != expected_length: raise SystemExit("telemetry page length mismatch")
          import hashlib
          if page.get("page_sha256") != hashlib.sha256(decoded).hexdigest(): raise SystemExit("telemetry page hash mismatch")
          with open(sys.argv[2],"ab") as stream: stream.write(decoded)
          PY
              done
              python3 - shadow-telemetry.jsonl.gz shadow-telemetry.manifest.json <<'PY'
          import gzip,hashlib,json,sys
          from pathlib import Path
          artifact=Path(sys.argv[1]).read_bytes(); manifest=json.loads(Path(sys.argv[2]).read_text())
          if len(artifact)>4*1024*1024 or hashlib.sha256(artifact).hexdigest()!=manifest["compressed_sha256"]: raise SystemExit("telemetry artifact hash mismatch")
          if hashlib.sha256(gzip.decompress(artifact)).hexdigest()!=manifest["session_sha256"]: raise SystemExit("telemetry session hash mismatch")
          PY
            fi
          fi
          if [[ "${DESIRED_STATE}" == continuous ]] && python3 - "${invocation_file}" <<'PY'
          import json
          from pathlib import Path
          import sys

          invocation = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if invocation.get("Status") != "Success" or invocation.get("ResponseCode") != 0:
              raise SystemExit(1)
          stdout = invocation.get("StandardOutputContent")
          if not isinstance(stdout, str):
              raise SystemExit(1)
          for raw in stdout.splitlines():
              line = raw.split("|", 1)[-1].strip()
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (
                  isinstance(item, dict)
                  and item.get("event") == "terminal"
                  and item.get("status") == "CLOSED"
                  and item.get("reason") == "calendar-closed"
              ):
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          then
            validator_event=terminal
          fi
          python3 .shadow-control-plane/deploy/ec2/shadow_invocation_diagnostic.py \
            --source-sha "${SOURCE_SHA}" \
            --image-digest "${IMAGE_DIGEST}" \
            --activation-id "${ACTIVATION_ID}" \
            --desired-state "${DESIRED_STATE}" --command-id "${command_id}" \
            <"${invocation_file}" >"${DIAGNOSTIC_FILENAME}"
          runtime_evidence="$(python3 deploy/ec2/shadow_runtime_evidence.py \
            --mode "${validator_mode}" --event "${validator_event}" \
            --source-sha "${SOURCE_SHA}" --image-digest "${IMAGE_DIGEST}" \
            --activation-id "${ACTIVATION_ID}" --input-format ssm-invocation \
            --output activation-summary <"${invocation_file}")"
          python3 - "${SOURCE_SHA}" "${IMAGE_DIGEST}" "${BUILD_RUN_ID}" "${ACTIVATION_ID}" \
            "${DESIRED_STATE}" "${command_id}" "${document_version}" \
            "${WORKER_SHA256}" "${VALIDATOR_SHA256}" \
            "${SHADOW_DOCUMENT_SHA256}" "${runtime_evidence}" >"${EVIDENCE_FILENAME}" <<'PY'
          import json
          import re
          import sys

          (source_sha, image_digest, build_run_id, activation_id, desired_state,
           command_id, document_version, worker_sha256,
           validator_sha256, shadow_document_sha256, runtime) = sys.argv[1:]
          if re.fullmatch(r"[1-9][0-9]*", document_version) is None:
              raise SystemExit("attested document version is invalid")
          if any(re.fullmatch(r"[0-9a-f]{64}", value) is None for value in (
              worker_sha256, validator_sha256, shadow_document_sha256,
          )):
              raise SystemExit("attested artifact-set hash is invalid")
          payload = {
              "source_sha": source_sha, "image_digest": image_digest,
              "build_run_id": build_run_id, "activation_id": activation_id,
              "desired_state": desired_state, "command_id": command_id,
              "document_version": document_version,
              "worker_sha256": worker_sha256,
              "validator_sha256": validator_sha256,
              "shadow_document_sha256": shadow_document_sha256,
              **json.loads(runtime),
          }
          print(json.dumps(payload, sort_keys=True, separators=(",", ":")))
          PY

      - name: Clear OIDC credentials before evidence upload
        timeout-minutes: 1
        if: always()
        shell: bash
        run: |
          {
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_SESSION_TOKEN='
            echo 'AWS_REGION='
            echo 'AWS_DEFAULT_REGION='
          } >>"${GITHUB_ENV}"

      - name: Notify protected shadow status
        timeout-minutes: 1
        if: always() && steps.resolve.outputs.status_notification == 'slack'
        env:
          KIWOOM_SHADOW_SLACK_WEBHOOK_URL: ${{ secrets.KIWOOM_SHADOW_SLACK_WEBHOOK_URL }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          schedule_observation_args=()
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            schedule_observation_args=(
              --schedule-observation "${RUNNER_TEMP}/shadow-schedule-observation-${GITHUB_RUN_ID}.json"
              --expected-run-id "${GITHUB_RUN_ID}"
              --expected-cron "${EVENT_SCHEDULE}"
            )
          fi
          python3 .shadow-control-plane/deploy/notify_shadow_status.py \
            --evidence "${EVIDENCE_FILENAME}" \
            --diagnostic "${DIAGNOSTIC_FILENAME}" \
            --receipt "${NOTIFICATION_RECEIPT_FILENAME}" \
            --source-sha "${{ steps.resolve.outputs.source_sha }}" \
            --image-digest "${{ steps.resolve.outputs.image_digest }}" \
            --activation-id "${{ steps.resolve.outputs.activation_id }}" \
            --desired-state "${{ steps.resolve.outputs.desired_state }}" \
            "${schedule_observation_args[@]}"

      - name: Upload bounded shadow evidence
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shadow-worker-${{ steps.resolve.outputs.source_sha }}-${{ steps.resolve.outputs.activation_id }}
          path: |
            ${{ env.EVIDENCE_FILENAME }}
            ${{ env.DIAGNOSTIC_FILENAME }}
            ${{ env.NOTIFICATION_RECEIPT_FILENAME }}
            ${{ runner.temp }}/shadow-schedule-observation-${{ github.run_id }}.json
            shadow-telemetry.jsonl.gz
            shadow-telemetry.manifest.json
          if-no-files-found: ignore
          retention-days: 14

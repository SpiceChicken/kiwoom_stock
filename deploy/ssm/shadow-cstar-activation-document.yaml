{
  "schemaVersion": "2.2",
  "description": "C* exact-generation shadow activation guarded by the EC2 durable fence",
  "parameters": {
    "Phase": {"type":"String","allowedValues":["start","stop"],"interpolationType":"ENV_VAR"},
    "ScheduleGeneration": {"type":"String","allowedPattern":"^cstar-g[0-9]{6,}$","interpolationType":"ENV_VAR"},
    "ScheduleArn": {"type":"String","allowedPattern":"^arn:aws:scheduler:[A-Za-z0-9-]+:[0-9]{12}:schedule/[A-Za-z0-9._/-]+$","interpolationType":"ENV_VAR"},
    "ScheduledTime": {"type":"String","allowedPattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$","interpolationType":"ENV_VAR"},
    "OccurrenceId": {"type":"String","allowedPattern":"^[0-9a-f]{64}$","interpolationType":"ENV_VAR"},
    "SessionDateKst": {"type":"String","allowedPattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}$","interpolationType":"ENV_VAR"},
    "ReleaseId": {"type":"String","allowedPattern":"^[0-9a-f]{64}$","interpolationType":"ENV_VAR"},
    "DesiredState": {"type":"String","allowedValues":["continuous","stop"],"interpolationType":"ENV_VAR"},
    "ImageDigest": {"type":"String","allowedPattern":"^ghcr\\.io/spicechicken/kiwoom_stock@sha256:[0-9a-f]{64}$","interpolationType":"ENV_VAR"},
    "SourceSha": {"type":"String","allowedPattern":"^[0-9a-f]{40}$","interpolationType":"ENV_VAR"},
    "ActivationId": {"type":"String","allowedPattern":"^shadow-session-[0-9]{8}$","interpolationType":"ENV_VAR"},
    "ComposeShadowSha256": {"type":"String","allowedPattern":"^[0-9a-f]{64}$","interpolationType":"ENV_VAR"},
    "ExpectedWorkerSha256": {"type":"String","allowedPattern":"^[0-9a-f]{64}$","interpolationType":"ENV_VAR"},
    "ExpectedValidatorSha256": {"type":"String","allowedPattern":"^[0-9a-f]{64}$","interpolationType":"ENV_VAR"},
    "ExpectedShadowDocumentSha256": {"type":"String","allowedPattern":"^[0-9a-f]{64}$","interpolationType":"ENV_VAR"},
    "ExpectedInstanceId": {"type":"String","allowedPattern":"^i-0e42e09d6c087ba29$","interpolationType":"ENV_VAR"},
    "Region": {"type":"String","allowedPattern":"^ap-northeast-2$","interpolationType":"ENV_VAR"}
  },
  "mainSteps": [{
    "action": "aws:runShellScript",
    "name": "runCStarActivation",
    "precondition": {"StringEquals":["platformType","Linux"]},
    "inputs": {
      "timeoutSeconds": "1020",
      "runCommand": [
        "set -eu",
        "exec /usr/local/libexec/kiwoom-shadow-schedule-fence.py activate --phase \"$SSM_Phase\" --schedule-generation \"$SSM_ScheduleGeneration\" --schedule-arn \"$SSM_ScheduleArn\" --scheduled-time \"$SSM_ScheduledTime\" --occurrence-id \"$SSM_OccurrenceId\" --session-date-kst \"$SSM_SessionDateKst\" --release-id \"$SSM_ReleaseId\" --desired-state \"$SSM_DesiredState\" --image \"$SSM_ImageDigest\" --source-sha \"$SSM_SourceSha\" --activation-id \"$SSM_ActivationId\" --compose-shadow-sha256 \"$SSM_ComposeShadowSha256\" --expected-worker-sha256 \"$SSM_ExpectedWorkerSha256\" --expected-validator-sha256 \"$SSM_ExpectedValidatorSha256\" --expected-shadow-document-sha256 \"$SSM_ExpectedShadowDocumentSha256\" --expected-instance-id \"$SSM_ExpectedInstanceId\" --region \"$SSM_Region\""
      ]
    }
  }]
}

schemaVersion: "2.2"
description: Install, read back, or roll back the exact shadow artifact set
parameters:
  Action:
    type: String
    allowedValues: [install, readback, rollback]
    interpolationType: ENV_VAR
  SourceSha:
    type: String
    allowedPattern: '^[0-9a-f]{40}$'
    interpolationType: ENV_VAR
  WorkerSha256:
    type: String
    allowedPattern: '^[0-9a-f]{64}$'
    interpolationType: ENV_VAR
  ValidatorSha256:
    type: String
    allowedPattern: '^[0-9a-f]{64}$'
    interpolationType: ENV_VAR
  ShadowDocumentSha256:
    type: String
    allowedPattern: '^[0-9a-f]{64}$'
    interpolationType: ENV_VAR
  RolloutAttemptId:
    type: String
    allowedPattern: '^[1-9][0-9]{0,19}$'
    interpolationType: ENV_VAR
  ExpectedInstanceId:
    type: String
    allowedPattern: '^i-0e42e09d6c087ba29$'
    interpolationType: ENV_VAR
  Region:
    type: String
    allowedPattern: '^ap-northeast-2$'
    interpolationType: ENV_VAR
mainSteps:
  - action: aws:runShellScript
    name: exactShadowArtifactSetRollout
    precondition:
      StringEquals: [platformType, Linux]
    inputs:
      timeoutSeconds: "300"
      runCommand:
        - |
          exec /bin/bash -s -- \
          "$SSM_Action" "$SSM_SourceSha" "$SSM_WorkerSha256" "$SSM_ValidatorSha256" \
          "$SSM_ShadowDocumentSha256" "$SSM_RolloutAttemptId" \
          "$SSM_ExpectedInstanceId" "$SSM_Region" <<'KIWOOM_ROLLOUT'
          set -Eeuo pipefail
          action="$1"; source_sha="$2"; worker_sha="$3"; validator_sha="$4"; document_sha="$5"; attempt="$6"; instance="$7"; region="$8"
          worker_target=/usr/local/sbin/kiwoom-shadow-worker
          validator_target=/usr/local/libexec/kiwoom-shadow-runtime-evidence.py
          state=/var/lib/kiwoom-stock/shadow-rollout-backups
          binding=/var/lib/kiwoom-stock/shadow-rollout-current.json
          lock=/run/lock/kiwoom-stock-shadow.lock
          fixed_container=kiwoom-shadow-once
          fixed_container_recovery=not-requested
          backup="${state}/${attempt}"
          [[ "$instance" == i-0e42e09d6c087ba29 && "$region" == ap-northeast-2 ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$worker_sha" =~ ^[0-9a-f]{64}$ && "$validator_sha" =~ ^[0-9a-f]{64}$ && "$document_sha" =~ ^[0-9a-f]{64}$ && "$attempt" =~ ^[1-9][0-9]{0,19}$ ]]
          case "$action" in install|readback|rollback) ;; *) printf 'unsupported rollout action: %s\n' "$action" >&2; exit 64 ;; esac
          install -d -o root -g root -m 0700 "$state"
          exec 9>"$lock"
          flock -x -w 240 9
          prepare_fixed_container_for_install() {
            local matches snapshot remaining
            command -v docker >/dev/null || { printf 'docker unavailable for fixed shadow guard\n' >&2; return 1; }
            if ! matches="$(docker container ls --all --filter 'name=^/kiwoom-shadow-once$' --format '{{.Names}}')"; then
              printf 'docker fixed shadow inventory failed\n' >&2
              return 1
            fi
            if [[ -z "$matches" ]]; then
              fixed_container_recovery=absent
              return 0
            fi
            [[ "$matches" == "$fixed_container" ]] || { printf 'fixed shadow inventory is ambiguous\n' >&2; return 1; }
            snapshot="$(mktemp "$state/.fixed-container-inspect.XXXXXX")"
            chmod 0600 "$snapshot"
            trap 'rm -f "$snapshot"' RETURN
            docker container inspect "$fixed_container" >"$snapshot" || { printf 'fixed shadow inspect failed\n' >&2; return 1; }
            if ! python3 - "$snapshot" "$binding" "$worker_target" "$validator_target" <<'PY'
          import hashlib,json,os,re,stat,sys
          snapshot,binding_path,worker_path,validator_path=sys.argv[1:]
          def reject(code):
              print(f"fixed-identity:{code}",file=sys.stderr)
              raise SystemExit(1)
          def regular(path,mode):
              try: value=os.stat(path,follow_symlinks=False)
              except OSError: return False
              return stat.S_ISREG(value.st_mode) and value.st_uid==0 and value.st_gid==0 and stat.S_IMODE(value.st_mode)==mode and value.st_nlink==1
          def digest(path):
              try:
                  with open(path,"rb") as stream: return hashlib.sha256(stream.read()).hexdigest()
              except OSError: reject("artifact_metadata")
          if not regular(binding_path,0o600) or not regular(worker_path,0o750) or not regular(validator_path,0o750): reject("artifact_metadata")
          try:
              with open(binding_path,encoding="utf-8") as stream: binding=json.load(stream)
          except (OSError,UnicodeError,json.JSONDecodeError): reject("binding_shape")
          if not isinstance(binding,dict) or set(binding)!={"source_sha","worker_sha256","validator_sha256","shadow_document_sha256","rollout_attempt_id"}: reject("binding_shape")
          if not isinstance(binding["source_sha"],str) or re.fullmatch(r"[0-9a-f]{40}",binding["source_sha"]) is None or not isinstance(binding["rollout_attempt_id"],str) or re.fullmatch(r"[1-9][0-9]{0,19}",binding["rollout_attempt_id"]) is None: reject("binding_value")
          for key in ("worker_sha256","validator_sha256","shadow_document_sha256"):
              if not isinstance(binding[key],str) or re.fullmatch(r"[0-9a-f]{64}",binding[key]) is None: reject("binding_value")
          if digest(worker_path)!=binding["worker_sha256"]: reject("worker_hash")
          if digest(validator_path)!=binding["validator_sha256"]: reject("validator_hash")
          try:
              with open(snapshot,encoding="utf-8") as stream: values=json.load(stream)
          except (OSError,UnicodeError,json.JSONDecodeError): reject("inspect_shape")
          if not isinstance(values,list) or len(values)!=1 or not isinstance(values[0],dict): reject("inspect_shape")
          item=values[0]; state=item.get("State"); config=item.get("Config"); host=item.get("HostConfig")
          if item.get("Name")!="/kiwoom-shadow-once" or not isinstance(state,dict) or state.get("Running") is not False or state.get("Status")!="exited": reject("lifecycle")
          if not isinstance(config,dict) or not isinstance(host,dict) or config.get("User")!="0:0": reject("config_shape")
          labels=config.get("Labels")
          if not isinstance(labels,dict): reject("labels_shape")
          source=labels.get("io.kiwoom.shadow.source-sha"); image=labels.get("io.kiwoom.shadow.image-digest"); activation=labels.get("io.kiwoom.shadow.activation-id")
          if source!=binding["source_sha"] or labels.get("io.kiwoom.shadow.mode")!="shadow-continuous": reject("source_mode")
          if not isinstance(image,str) or re.fullmatch(r"ghcr\.io/spicechicken/kiwoom_stock@sha256:[0-9a-f]{64}",image) is None or config.get("Image")!=image: reject("image")
          if not isinstance(activation,str) or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}",activation) is None: reject("activation")
          expected=["python","-m","kiwoom_stock","shadow-worker","--source-sha",source,"--image-digest",image,"--activation-id",activation]
          if config.get("Cmd")!=expected: reject("command")
          restart=host.get("RestartPolicy")
          if host.get("ReadonlyRootfs") is not True or not isinstance(restart,dict) or restart.get("Name")!="no": reject("runtime_security")
          cap_drop=host.get("CapDrop"); cap_add=host.get("CapAdd")
          legacy_cap_add={"CHOWN","SETGID","SETUID"}
          canonical_cap_add={"CAP_CHOWN","CAP_SETGID","CAP_SETUID"}
          if not isinstance(cap_drop,list) or len(cap_drop)!=1 or not all(isinstance(value,str) for value in cap_drop) or set(cap_drop)!={"ALL"} or not isinstance(cap_add,list) or len(cap_add)!=3 or not all(isinstance(value,str) for value in cap_add) or set(cap_add) not in (legacy_cap_add,canonical_cap_add): reject("capabilities")
          security_opt=host.get("SecurityOpt")
          if not isinstance(security_opt,list) or not all(isinstance(value,str) for value in security_opt) or "no-new-privileges:true" not in security_opt: reject("no_new_privileges")
          PY
            then
              printf 'fixed stopped shadow identity validation failed\n' >&2
              return 1
            fi
            docker rm -- "$fixed_container" >/dev/null || { printf 'validated stopped shadow removal failed\n' >&2; return 1; }
            if ! remaining="$(docker container ls --all --filter 'name=^/kiwoom-shadow-once$' --format '{{.Names}}')"; then
              printf 'docker fixed shadow post-removal inventory failed\n' >&2
              return 1
            fi
            [[ -z "$remaining" ]] || { printf 'validated stopped shadow remains\n' >&2; return 1; }
            fixed_container_recovery=removed
            rm -f "$snapshot"
            trap - RETURN
          }
          if [[ "$action" == install ]]; then prepare_fixed_container_for_install; fi
          fsync_file() { python3 - "$1" <<'PY'
          import os,sys
          descriptor=os.open(sys.argv[1],os.O_RDONLY); os.fsync(descriptor); os.close(descriptor)
          PY
          }
          fsync_parent() { python3 - "$1" <<'PY'
          import os,sys
          descriptor=os.open(os.path.dirname(sys.argv[1]),os.O_RDONLY|os.O_DIRECTORY); os.fsync(descriptor); os.close(descriptor)
          PY
          }
          fsync_directory() { python3 - "$1" <<'PY'
          import os,sys
          descriptor=os.open(sys.argv[1],os.O_RDONLY|os.O_DIRECTORY); os.fsync(descriptor); os.close(descriptor)
          PY
          }
          publish() {
            local source="$1" destination="$2" mode="$3" expected="$4" syntax="$5" directory temporary
            directory="$(dirname "$destination")"; temporary="$(mktemp "${directory}/.kiwoom-rollout.XXXXXX")"
            trap 'rm -f "$temporary"' RETURN
            install -o root -g root -m "$mode" "$source" "$temporary"
            [[ "$(stat -c '%u:%g:%a:%h:%F' "$temporary")" == "0:0:${mode}:1:regular file" ]]
            [[ "$(sha256sum "$temporary" | cut -d' ' -f1)" == "$expected" ]]
            case "$syntax" in shell) bash -n "$temporary" ;; python) python3 -c 'import sys; compile(open(sys.argv[1], encoding="utf-8").read(), sys.argv[1], "exec")' "$temporary" ;; no) ;; *) return 64 ;; esac
            fsync_file "$temporary"; mv -fT "$temporary" "$destination"; fsync_parent "$destination"
            trap - RETURN
          }
          remove_published() { rm -f -- "$1"; fsync_parent "$1"; }
          metadata() { [[ -f "$1" && ! -L "$1" ]] && [[ "$(stat -c '%u:%g:%a:%h:%F' "$1")" == '0:0:750:1:regular file' ]]; }
          emit() { python3 - "$action" "$worker_target" "$validator_target" "$binding" "$fixed_container_recovery" <<'PY'
          import hashlib,json,os,stat,sys
          def metadata(path,expected_mode):
              try: value=os.lstat(path)
              except FileNotFoundError: return {"present":False,"owner":"","mode":"","links":0,"regular":False,"metadata_valid":True,"sha256":""}
              regular=stat.S_ISREG(value.st_mode); mode=format(stat.S_IMODE(value.st_mode),"03o"); owner=f"{value.st_uid}:{value.st_gid}"
              return {"present":True,"owner":owner,"mode":mode,"links":value.st_nlink,"regular":regular,"metadata_valid":regular and not stat.S_ISLNK(value.st_mode) and owner=="0:0" and mode==expected_mode and value.st_nlink==1,"sha256":hashlib.sha256(open(path,"rb").read()).hexdigest() if regular else ""}
          worker=metadata(sys.argv[2],"750"); validator=metadata(sys.argv[3],"750"); marker=metadata(sys.argv[4],"600")
          try:
              with open(sys.argv[4],encoding="utf-8") as stream: binding=json.load(stream)
          except Exception:
              binding={}
          output={"action":sys.argv[1],"source_sha":binding.get("source_sha",""),"worker_sha256":binding.get("worker_sha256",""),"validator_sha256":binding.get("validator_sha256",""),"shadow_document_sha256":binding.get("shadow_document_sha256",""),"rollout_attempt_id":binding.get("rollout_attempt_id",""),"observed_worker_sha256":worker["sha256"],"observed_validator_sha256":validator["sha256"],"worker_present":worker["present"],"worker_owner":worker["owner"],"worker_mode":worker["mode"],"worker_links":worker["links"],"worker_regular":worker["regular"],"worker_metadata_valid":worker["metadata_valid"],"validator_present":validator["present"],"validator_owner":validator["owner"],"validator_mode":validator["mode"],"validator_links":validator["links"],"validator_regular":validator["regular"],"validator_metadata_valid":validator["metadata_valid"],"binding_present":marker["present"],"binding_owner":marker["owner"],"binding_mode":marker["mode"],"binding_links":marker["links"],"binding_regular":marker["regular"],"binding_metadata_valid":marker["metadata_valid"],"fixed_container_recovery":sys.argv[5]}
          print(json.dumps(output,sort_keys=True,separators=(",",":")))
          PY
          }
          verify_backup() { python3 - "$backup" "$source_sha" "$worker_sha" "$validator_sha" "$document_sha" "$attempt" <<'PY'
          import hashlib,json,os,stat,sys
          root,source,worker,validator,document,attempt=sys.argv[1:]
          root_stat=os.stat(root,follow_symlinks=False)
          if not stat.S_ISDIR(root_stat.st_mode) or root_stat.st_uid!=0 or root_stat.st_gid!=0 or stat.S_IMODE(root_stat.st_mode)!=0o700: raise SystemExit(1)
          with open(os.path.join(root,"manifest.json"),encoding="utf-8") as stream: manifest=json.load(stream)
          manifest_stat=os.stat(os.path.join(root,"manifest.json"),follow_symlinks=False)
          if not stat.S_ISREG(manifest_stat.st_mode) or manifest_stat.st_uid!=0 or manifest_stat.st_gid!=0 or stat.S_IMODE(manifest_stat.st_mode)!=0o600 or manifest_stat.st_nlink!=1: raise SystemExit(1)
          if any((manifest.get("source_sha")!=source,manifest.get("worker_sha256")!=worker,manifest.get("validator_sha256")!=validator,manifest.get("shadow_document_sha256")!=document,manifest.get("rollout_attempt_id")!=attempt)): raise SystemExit(1)
          for name,key in (("worker","prior_worker_sha256"),("validator","prior_validator_sha256"),("binding","prior_binding_sha256")):
              expected=manifest.get(key); path=os.path.join(root,name); sentinel=path+".absent"
              if expected=="absent":
                  selected=sentinel
                  if not os.path.isfile(selected) or os.path.exists(path): raise SystemExit(1)
              else:
                  selected=path
                  if not isinstance(expected,str) or not os.path.isfile(path) or hashlib.sha256(open(path,"rb").read()).hexdigest()!=expected: raise SystemExit(1)
              selected_stat=os.stat(selected,follow_symlinks=False)
              if not stat.S_ISREG(selected_stat.st_mode) or selected_stat.st_uid!=0 or selected_stat.st_gid!=0 or stat.S_IMODE(selected_stat.st_mode)!=0o600 or selected_stat.st_nlink!=1: raise SystemExit(1)
          PY
          }
          rollback_set() {
            local expected
            verify_backup
            if [[ -f "$backup/worker.absent" ]]; then remove_published "$worker_target"; else expected="$(sha256sum "$backup/worker" | cut -d' ' -f1)"; publish "$backup/worker" "$worker_target" 750 "$expected" shell; fi
            if [[ -f "$backup/validator.absent" ]]; then remove_published "$validator_target"; else expected="$(sha256sum "$backup/validator" | cut -d' ' -f1)"; publish "$backup/validator" "$validator_target" 750 "$expected" python; fi
            if [[ -f "$backup/binding.absent" ]]; then remove_published "$binding"; else expected="$(sha256sum "$backup/binding" | cut -d' ' -f1)"; publish "$backup/binding" "$binding" 600 "$expected" no; fi
            if [[ -f "$backup/worker.absent" ]]; then [[ ! -e "$worker_target" ]]; else metadata "$worker_target"; cmp -s "$backup/worker" "$worker_target"; fi
            if [[ -f "$backup/validator.absent" ]]; then [[ ! -e "$validator_target" ]]; else metadata "$validator_target"; cmp -s "$backup/validator" "$validator_target"; fi
            if [[ -f "$backup/binding.absent" ]]; then [[ ! -e "$binding" ]]; else [[ -f "$binding" && ! -L "$binding" && "$(stat -c '%u:%g:%a:%h:%F' "$binding")" == '0:0:600:1:regular file' ]]; cmp -s "$backup/binding" "$binding"; fi
          }
          if [[ "$action" == readback ]]; then
            if [[ -e "$worker_target" ]]; then metadata "$worker_target"; fi
            if [[ -e "$validator_target" ]]; then metadata "$validator_target"; fi
            if [[ -e "$binding" ]]; then [[ -f "$binding" && ! -L "$binding" && "$(stat -c '%u:%g:%a:%h:%F' "$binding")" == '0:0:600:1:regular file' ]]; fi
            emit; exit
          fi
          if [[ "$action" == install ]]; then
            if metadata "$worker_target" && metadata "$validator_target" && [[ "$(sha256sum "$worker_target" | cut -d' ' -f1)" == "$worker_sha" ]] && [[ "$(sha256sum "$validator_target" | cut -d' ' -f1)" == "$validator_sha" ]] && python3 - "$binding" "$source_sha" "$worker_sha" "$validator_sha" "$document_sha" "$attempt" <<'PY'
          import json,sys
          try: value=json.load(open(sys.argv[1],encoding="utf-8"))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if value == {"source_sha":sys.argv[2],"worker_sha256":sys.argv[3],"validator_sha256":sys.argv[4],"shadow_document_sha256":sys.argv[5],"rollout_attempt_id":sys.argv[6]} else 1)
          PY
            then emit; exit; fi
            if [[ -e "$backup" ]]; then
              [[ -d "$backup" && ! -L "$backup" ]]; verify_backup
            else
              staging="$(mktemp -d "$state/.attempt-${attempt}.staging.XXXXXX")"; chmod 0700 "$staging"; chown root:root "$staging"
              if [[ -e "$worker_target" ]]; then metadata "$worker_target"; install -o root -g root -m 0600 "$worker_target" "$staging/worker"; worker_before="$(sha256sum "$staging/worker" | cut -d' ' -f1)"; fsync_file "$staging/worker"; else : >"$staging/worker.absent"; chmod 0600 "$staging/worker.absent"; chown root:root "$staging/worker.absent"; fsync_file "$staging/worker.absent"; worker_before=absent; fi
              if [[ -e "$validator_target" ]]; then metadata "$validator_target"; install -o root -g root -m 0600 "$validator_target" "$staging/validator"; validator_before="$(sha256sum "$staging/validator" | cut -d' ' -f1)"; fsync_file "$staging/validator"; else : >"$staging/validator.absent"; chmod 0600 "$staging/validator.absent"; chown root:root "$staging/validator.absent"; fsync_file "$staging/validator.absent"; validator_before=absent; fi
              if [[ -e "$binding" ]]; then [[ -f "$binding" && ! -L "$binding" ]]; install -o root -g root -m 0600 "$binding" "$staging/binding"; binding_before="$(sha256sum "$staging/binding" | cut -d' ' -f1)"; fsync_file "$staging/binding"; else : >"$staging/binding.absent"; chmod 0600 "$staging/binding.absent"; chown root:root "$staging/binding.absent"; fsync_file "$staging/binding.absent"; binding_before=absent; fi
              python3 - "$source_sha" "$worker_sha" "$validator_sha" "$document_sha" "$attempt" "$worker_before" "$validator_before" "$binding_before" >"$staging/manifest.json" <<'PY'
          import json,sys
          print(json.dumps({"source_sha":sys.argv[1],"worker_sha256":sys.argv[2],"validator_sha256":sys.argv[3],"shadow_document_sha256":sys.argv[4],"rollout_attempt_id":sys.argv[5],"prior_worker_sha256":sys.argv[6],"prior_validator_sha256":sys.argv[7],"prior_binding_sha256":sys.argv[8]},sort_keys=True,separators=(",",":")))
          PY
              chmod 0600 "$staging/manifest.json"; chown root:root "$staging/manifest.json"; fsync_file "$staging/manifest.json"; fsync_directory "$staging"
              mv -T "$staging" "$backup"; fsync_directory "$state"; verify_backup
            fi
            trap 'rc=$?; trap - ERR; rollback_set >/dev/null 2>&1 || true; exit "$rc"' ERR
            downloaded="$(mktemp "$state/.worker-download.XXXXXX")"; validator_downloaded="$(mktemp "$state/.validator-download.XXXXXX")"; marker="$(mktemp "$state/.binding-stage.XXXXXX")"; trap 'rm -f "$downloaded" "$validator_downloaded" "$marker"' EXIT
            download_github_file() {
              local path="$1"; local destination="$2"; local response
              case "$path" in
                deploy/ec2/shadow_worker_control.sh|deploy/ec2/shadow_runtime_evidence.py) ;;
                *) printf 'unsupported GitHub path: %s\n' "$path" >&2; return 64 ;;
              esac
              response="$(mktemp "$state/.github-api-response.XXXXXX")"
              trap 'rm -f "$response"' RETURN
              timeout 45 curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/SpiceChicken/kiwoom_stock/contents/${path}?ref=${source_sha}" \
                -o "$response"
              python3 - "$response" "$destination" "$path" <<'PY'
          import base64,json,os,sys
          response,destination,path=sys.argv[1:]
          with open(response,encoding="utf-8") as stream: value=json.load(stream)
          if value.get("type")!="file" or value.get("path")!=path or value.get("encoding")!="base64" or not isinstance(value.get("content"),str): raise SystemExit("GitHub Contents response shape invalid")
          encoded="".join(value["content"].split())
          try: decoded=base64.b64decode(encoded,validate=True)
          except (ValueError,base64.binascii.Error) as error: raise SystemExit("GitHub Contents base64 invalid") from error
          if not decoded: raise SystemExit("GitHub Contents file empty")
          descriptor=os.open(destination,os.O_WRONLY|os.O_TRUNC|os.O_NOFOLLOW)
          with os.fdopen(descriptor,"wb") as stream: stream.write(decoded)
          PY
              rm -f "$response"
              trap - RETURN
            }
            download_github_file deploy/ec2/shadow_worker_control.sh "$downloaded"
            download_github_file deploy/ec2/shadow_runtime_evidence.py "$validator_downloaded"
            [[ "$(sha256sum "$downloaded" | cut -d' ' -f1)" == "$worker_sha" ]]; bash -n "$downloaded"
            [[ "$(sha256sum "$validator_downloaded" | cut -d' ' -f1)" == "$validator_sha" ]]; python3 -c 'import sys; compile(open(sys.argv[1], encoding="utf-8").read(), sys.argv[1], "exec")' "$validator_downloaded"
            python3 - "$source_sha" "$worker_sha" "$validator_sha" "$document_sha" "$attempt" >"$marker" <<'PY'
          import json,sys
          print(json.dumps({"source_sha":sys.argv[1],"worker_sha256":sys.argv[2],"validator_sha256":sys.argv[3],"shadow_document_sha256":sys.argv[4],"rollout_attempt_id":sys.argv[5]},sort_keys=True,separators=(",",":")))
          PY
            marker_sha="$(sha256sum "$marker" | cut -d' ' -f1)"
            install -d -o root -g root -m 0755 "$(dirname "$validator_target")"
            publish "$validator_downloaded" "$validator_target" 750 "$validator_sha" python
            publish "$downloaded" "$worker_target" 750 "$worker_sha" shell
            publish "$marker" "$binding" 600 "$marker_sha" no
            trap - ERR; metadata "$worker_target"; metadata "$validator_target"; emit; exit
          fi
          rollback_set; emit
          KIWOOM_ROLLOUT

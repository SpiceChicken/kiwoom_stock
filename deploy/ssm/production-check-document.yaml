schemaVersion: "2.2"
description: Run the preinstalled Kiwoom networkless production configuration check
parameters:
  ImageDigest:
    type: String
    description: Exact public GHCR OCI digest
    allowedPattern: '^ghcr\.io/spicechicken/kiwoom_stock@sha256:[0-9a-f]{64}$'
    interpolationType: ENV_VAR
  SourceSha:
    type: String
    description: Exact source commit
    allowedPattern: '^[0-9a-f]{40}$'
    interpolationType: ENV_VAR
  PromotionAttemptId:
    type: String
    description: Unique positive GitHub workflow run ID for idempotency
    allowedPattern: '^[1-9][0-9]{0,19}$'
    interpolationType: ENV_VAR
  ComposeSha256:
    type: String
    description: compose.yaml SHA256
    allowedPattern: '^[0-9a-f]{64}$'
    interpolationType: ENV_VAR
  ComposeProdSha256:
    type: String
    description: compose.prod.yaml SHA256
    allowedPattern: '^[0-9a-f]{64}$'
    interpolationType: ENV_VAR
  ExpectedInstanceId:
    type: String
    description: Exact approved EC2 instance
    allowedPattern: '^i-02cb0a404794bd43a$'
    interpolationType: ENV_VAR
  Region:
    type: String
    description: Exact approved AWS region
    allowedPattern: '^ap-northeast-2$'
    interpolationType: ENV_VAR
mainSteps:
  - action: aws:runShellScript
    name: runProductionCheck
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: "720"
      runCommand:
        - >-
          exec /usr/local/sbin/kiwoom-production-check
          --image "$SSM_ImageDigest"
          --source-sha "$SSM_SourceSha"
          --promotion-attempt-id "$SSM_PromotionAttemptId"
          --compose-sha256 "$SSM_ComposeSha256"
          --compose-prod-sha256 "$SSM_ComposeProdSha256"
          --expected-instance-id "$SSM_ExpectedInstanceId"
          --region "$SSM_Region"

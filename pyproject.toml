# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwoom_stock"
# 1. 버전 업데이트: v2.6 반영
version = "2.6.4"
description = "Kiwoom Stock Trading System (v2.6) with CI/CD"
readme = "README.MD"
requires-python = ">=3.11"
# 2. 필수 라이브러리 명시 (requirements.txt 대체)
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "slack-sdk>=3.0.0",
    "boto3>=1.34.0",
    "google-genai>=2.12.1",
    "exchange-calendars>=4.5",
    "tenacity>=8.2.0",
    "pydantic-settings>=2.10.1,<2.11"
]

[project.scripts]
kiwoom-live-readonly-validate = "kiwoom_stock.validation.live_readonly:main"

# 3. 개발/테스트용 의존성 (python -m pip install -e ".[dev]" 로 설치)
[project.optional-dependencies]
dev = [
    "setuptools>=61.0",
    "pytest",
    "pytest-mock",
    "requests-mock",
    "flake8",
    "mypy",
    "build",
    "PyYAML",
    "types-requests",
    "pandas-stubs"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kiwoom_stock.resources.prompts" = ["*.md"]

# --- 아래는 CI/CD 도구 설정 ---

# Pytest 설정: 소스 경로 인식
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

# Mypy (타입 체크) 설정
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
# 외부 라이브러리(pywin32 등) 타입 힌트가 없어도 에러 무시
ignore_missing_imports = true
